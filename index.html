<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin: Tic Tac Toe</title>
    <script src="tic-tac-toe.js" type="text/javascript" defer></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Tic Tac Toe</h1>
    </header>
    <main>
        <div id="setup">
            <input id="player-one" type="text" placeholder="Player One">
            <input id="player-two" type="text" placeholder="Player Two">
            <button id="start">Start</button>
        </div>
        <p id="status" aria-live="polite">Fill in player's names and Start the game.</p>
        <div id="board"></div>
    </main>
    <footer>
        <p>Copyright &copy; 
            <script>
                document.write(new Date().getFullYear());
            </script>
             fruitsofbabylon
        </p>
        <a href="https://github.com/fruitsofbabylon">
            <img src="github.png" alt="github logo and link">
        </a>
    </footer>
</body>
</html>
